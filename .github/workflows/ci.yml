name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests from forks get a read-only token; nothing here needs more.
permissions:
  contents: read

# A new push to the same PR cancels the run that is still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Smoke test the binary
        run: cargo run -- -C fixtures/polyglot --no-runtime --json

  install:
    name: Installer channels (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test every install channel against a local release mirror
        run: tests/install/run.sh
