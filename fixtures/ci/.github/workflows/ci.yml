name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Unit tests
        run: npm test
      - run: |
          npm run build
          npx playwright test
      - name: Clean with Python
        shell: python
        run: |
          import shutil, subprocess
          shutil.rmtree("build", ignore_errors=True)  # rm -rf build
          subprocess.run(["git", "clean", "-fdx"], check=True)
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: npx wrangler deploy
