name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Unit tests
        run: npm test
      - run: |
          npm run build
          npx playwright test
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: npx wrangler deploy
