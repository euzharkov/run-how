[project]
name = "svc"
version = "0.1.0"
dependencies = ["fastapi", "uvicorn"]

[project.scripts]
svc = "svc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "pre-commit"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
