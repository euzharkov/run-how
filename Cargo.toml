[package]
name = "rhow"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Discover how to run and operate any repository: one command lists the useful actions of a project"
license = "MIT"
repository = "https://github.com/euzharkov/run-how"
homepage = "https://github.com/euzharkov/run-how"
readme = "README.md"
keywords = ["cli", "developer-tools", "task-runner", "monorepo", "discovery"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["fixtures/", ".github/", "packaging/", "docs/"]

[[bin]]
name = "rhow"
path = "src/main.rs"

[lib]
name = "rhow"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
serde_yaml = "0.9"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package.insta]
opt-level = 3

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
